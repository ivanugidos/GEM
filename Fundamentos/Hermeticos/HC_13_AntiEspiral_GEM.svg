<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="nucleo" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffd166" stop-opacity="0.55"/><stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <polyline id="spiral" fill="none" stroke-linecap="round" stroke-linejoin="round" points="8,0 8.4,2.2 8.1,4.7 7.2,7.2 5.5,9.5 3.1,11.5 0,12.9 -3.6,13.5 -7.6,13.2 -11.6,11.6 -15.4,8.9 -18.7,5 -20.9,0 -21.9,-5.9 -21.3,-12.3 -18.8,-18.8 -14.4,-25 -8.1,-30.2 0,-33.9 9.5,-35.5 19.9,-34.5 30.5,-30.5 40.4,-23.4 48.9,-13.1 54.8,0 57.4,15.4 55.7,32.2 49.3,49.3 37.8,65.4 21.2,79.1 0,88.7 -24.9,92.9 -52.1,90.2 -79.8,79.8 -105.9,61.1 -128,34.3 -143.5,0 -150.2,-40.3 -145.9,-84.3 -129.1,-129.1 -98.9,-171.3 -55.5,-207.1 0,-232.3 65.2,-243.1 136.3,-236.1 208.9,-208.9 277.2,-160 335,-89.8 375.8,0"/>
  </defs>

  <rect width="1000" height="1000" fill="#05070c"/>
  <text x="500" y="46" fill="#f2f2f2" font-size="27" font-weight="bold" text-anchor="middle" letter-spacing="3">HC_11 · LA ANTI-ESPIRAL</text>
  <text x="500" y="72" fill="#8fd8ff" font-size="14" text-anchor="middle" letter-spacing="4">LA ESPIRAL DE COMPACTACIÓN DEL MODELO GEM — S₊ ⊕ S₋ = RESPIRACIÓN DEL VACÍO</text>

  <g transform="translate(500,520)">
    <!-- 12 Líneas Magnéticas (red I_h) -->
    <g stroke="#16202e" stroke-width="1">
      <line y2="-380"/><line y2="-380" transform="rotate(30)"/><line y2="-380" transform="rotate(60)"/><line y2="-380" transform="rotate(90)"/><line y2="-380" transform="rotate(120)"/><line y2="-380" transform="rotate(150)"/><line y2="-380" transform="rotate(180)"/><line y2="-380" transform="rotate(210)"/><line y2="-380" transform="rotate(240)"/><line y2="-380" transform="rotate(270)"/><line y2="-380" transform="rotate(300)"/><line y2="-380" transform="rotate(330)"/>
    </g>
    <!-- 16 segmentos de Hunab Ku 22.22° : el ciclo NO cierra (respiración) -->
    <g stroke="#3a475c" stroke-width="2">
      <line y1="-380" y2="-394"/><line y1="-380" y2="-394" transform="rotate(22.2)"/><line y1="-380" y2="-394" transform="rotate(44.4)"/><line y1="-380" y2="-394" transform="rotate(66.7)"/><line y1="-380" y2="-394" transform="rotate(88.9)"/><line y1="-380" y2="-394" transform="rotate(111.1)"/><line y1="-380" y2="-394" transform="rotate(133.3)"/><line y1="-380" y2="-394" transform="rotate(155.6)"/><line y1="-380" y2="-394" transform="rotate(177.8)"/><line y1="-380" y2="-394" transform="rotate(200)"/><line y1="-380" y2="-394" transform="rotate(222.2)"/><line y1="-380" y2="-394" transform="rotate(244.4)"/><line y1="-380" y2="-394" transform="rotate(266.7)"/><line y1="-380" y2="-394" transform="rotate(288.9)"/><line y1="-380" y2="-394" transform="rotate(311.1)"/><line y1="-380" y2="-394" transform="rotate(333.3)"/>
    </g>
    <!-- guías φ -->
    <circle r="89" fill="none" stroke="#22303f" stroke-dasharray="3 6"/>
    <circle r="144" fill="none" stroke="#22303f" stroke-dasharray="3 6"/>

    <!-- S+ inflación / S- compactación (dual conforme) -->
    <use href="#spiral" stroke="#6fd7ff" stroke-width="2.4" filter="url(#glow)"/>
    <use href="#spiral" stroke="#ff5fd2" stroke-width="2.4" filter="url(#glow)" transform="scale(-1,1)"/>

    <!-- Nodos de Nulificación Vectorial (v=0 → 2w) -->
    <g fill="#ffffff" filter="url(#glow)">
      <circle cy="12.9" r="4"/><circle cy="-33.9" r="4.5"/><circle cy="88.7" r="5"/><circle cy="-232.3" r="6"/>
    </g>
    <g fill="none" stroke="#ffd166" stroke-width="1.2">
      <circle cy="12.9" r="8"/><circle cy="-33.9" r="9"/><circle cy="88.7" r="10"/><circle cy="-232.3" r="12"/>
    </g>

    <!-- Hunab Ku central -->
    <circle r="26" fill="url(#nucleo)"/>
    <circle r="7" fill="#ffffff" filter="url(#glow)"/>
    <circle r="16" fill="none" stroke="#ffd166" stroke-width="1.4"/>
    <text x="26" y="34" fill="#ffd166" font-size="13">HUNAB KU · 22.22°</text>
    <text x="382" y="-8" fill="#6fd7ff" font-size="13">S₊ → inflación</text>
    <text x="-378" y="-8" fill="#ff5fd2" font-size="13" text-anchor="end">← S₋ compactación</text>
    <text x="14" y="-238" fill="#ffd166" font-size="12">nodos: v=0 → 2w</text>
  </g>

  <!-- Bloque de ecuaciones -->
  <g fill="#cfd8e3" font-size="15">
    <text x="640" y="140" fill="#6fd7ff" font-weight="bold">S₊ : r = r₀·e^(+bθ)</text>
    <text x="640" y="164" fill="#ff5fd2" font-weight="bold">S₋ : r = r₀·e^(−bθ) = D̂(S₊)</text>
    <text x="640" y="190">b = 2·ln φ / π ≈ 0.30635</text>
    <text x="640" y="214">ψ = arctan(1/b) ≈ 72.97°</text>
    <text x="640" y="238">D̂ : r → r₀²/r  (inversión conforme)</text>
    <text x="640" y="262" fill="#ffd166">q + D̂(q) = 2w   (nulificación vectorial)</text>
    <text x="640" y="286">16.2 Hz · φ² = 2.618 · 142857</text>
    <text x="640" y="310">441 = 21² · 1836 = 3×(5×7)×F</text>
  </g>

  <!-- Leyenda -->
  <g font-size="13" fill="#9fb0c3">
    <text x="40" y="880" fill="#6fd7ff">— S₊ : Espiral de Cristal (inflación, Ciclo del Devenir)</text>
    <text x="40" y="902" fill="#ff5fd2">— S₋ : Anti-Espiral (compactación, Ciclo del Retorno)</text>
    <text x="40" y="924" fill="#ffffff">● Nodos de aniquilación vectorial: la Válvula de Vacío</text>
    <text x="40" y="946">| Ticks de 22.22° : 16 segmentos + resto → el ciclo respira, no cierra</text>
  </g>
  <text x="500" y="978" fill="#66788c" font-size="12" text-anchor="middle" letter-spacing="1">MODELO GEM · Iván Ugidos Martínez + Co-Investigación IA · CC BY-SA 4.0 · github.com/ivanugidos/GEM · “La geometría es el código, la resonancia es la llave, el vacío es el medio”</text>
</svg>